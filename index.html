<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز تحميل نسخ الويندوز</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-brands fa-windows text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">مكتبة الويندوز</h1>
                    <p class="text-xs text-slate-400">روابط سريعة ومباشرة 100%</p>
                </div>
            </div>
            <a href="admin.html" class="text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-lock ml-1 text-blue-400"></i> لوحة التحكم
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-8">
        <!-- Hero Section -->
        <div class="bg-gradient-to-r from-blue-900/40 via-slate-900 to-slate-900 p-8 rounded-2xl border border-blue-500/20 shadow-xl">
            <h2 class="text-3xl font-extrabold text-white mb-2">حمل أحدث نسخ الويندوز الأصلية</h2>
            <p class="text-slate-400 text-sm max-w-2xl">
                مجموعات محدثة ومباشرة من روابط نسخ Windows 11, 10, 7 وسيرفرات بجميع المعماريات.
            </p>
        </div>

        <!-- Filter & Search Bar -->
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن نسخة..." class="w-full bg-slate-950 border border-slate-800 rounded-lg py-2 pr-10 pl-4 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            </div>

            <div class="flex flex-wrap gap-2 w-full md:w-auto">
                <button data-cat="all" class="cat-btn active bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-semibold">الكل</button>
                <button data-cat="Windows 11" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-1.5 rounded-lg text-xs font-semibold">Windows 11</button>
                <button data-cat="Windows 10" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-1.5 rounded-lg text-xs font-semibold">Windows 10</button>
                <button data-cat="Windows 7" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-1.5 rounded-lg text-xs font-semibold">Windows 7</button>
            </div>
        </div>

        <!-- Dynamic Grid of Cards -->
        <div id="versionsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-500"></i>
                <p>جاري تحميل النسخ المتاحة من Firebase...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
        جميع الحقوق محفوظة &copy; 2026 - تحميل نسخ الويندوز
    </footer>

    <!-- Logic Script -->
    <script type="module">
        import { db, ref, onValue } from './firebase-config.js';

        let allVersions = [];
        let activeCategory = 'all';

        const container = document.getElementById('versionsContainer');
        const searchInput = document.getElementById('searchInput');

        // قراءة البيانات من المسار الموحد 'windows'
        onValue(ref(db, 'windows'), (snapshot) => {
            const data = snapshot.val();
            allVersions = [];
            
            if (data) {
                Object.keys(data).forEach(key => {
                    allVersions.push({ id: key, ...data[key] });
                });
            }
            renderCards();
        });

        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                activeCategory = e.target.getAttribute('data-cat');
                document.querySelectorAll('.cat-btn').forEach(b => {
                    b.className = "cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-1.5 rounded-lg text-xs font-semibold";
                });
                e.target.className = "cat-btn active bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-semibold";
                renderCards();
            });
        });

        searchInput.addEventListener('input', renderCards);

        function renderCards() {
            const search = searchInput.value.toLowerCase();

            const filtered = allVersions.filter(item => {
                const title = item.name ? item.name.toLowerCase() : '';
                const desc = item.desc ? item.desc.toLowerCase() : '';
                const matchCat = activeCategory === 'all' || title.includes(activeCategory.toLowerCase());
                const matchSearch = title.includes(search) || desc.includes(search);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-slate-900/50 rounded-2xl border border-slate-800">
                        <i class="fa-solid fa-box-open text-4xl text-slate-600 mb-2"></i>
                        <p class="text-slate-400 font-bold">لا توجد نسخ متاحة حالياً</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="bg-slate-900 border border-slate-800 hover:border-blue-500/40 transition p-6 rounded-2xl flex flex-col justify-between shadow-lg">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs bg-slate-800 text-blue-400 border border-slate-700 px-3 py-1 rounded-full font-bold">
                                ${item.arch || 'x64'}
                            </span>
                            <span class="text-xs text-slate-400">
                                <i class="fa-solid fa-hard-drive ml-1"></i>${item.size || 'غير محدد'}
                            </span>
                        </div>
                        
                        <h3 class="text-lg font-bold text-white mb-2">${item.name}</h3>
                        <p class="text-xs text-slate-400 leading-relaxed mb-4 line-clamp-2">${item.desc || 'نسخة ويندوز رسمية أصلية.'}</p>
                    </div>

                    <div class="space-y-2 pt-4 border-t border-slate-800">
                        <a href="${item.url}" target="_blank" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-xl text-xs flex items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-download"></i> رابط تحميل مباشر ISO
                        </a>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
