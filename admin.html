<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة النسخ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- شاشة تسجيل الدخول بكلمة المرور -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-2xl max-w-md w-full text-center shadow-2xl">
            <div class="w-16 h-16 rounded-2xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-3xl text-blue-500 mx-auto mb-4">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">تسجيل الدخول للوحة التحكم</h2>
            <p class="text-slate-400 text-xs mb-6">يرجى إدخال كلمة المرور للوصول إلى أدوات الإدارة</p>

            <form id="loginForm" class="space-y-4">
                <div>
                    <input type="password" id="passInput" placeholder="أدخل كلمة المرور..." required 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500 text-center">
                </div>
                <p id="loginError" class="text-red-500 text-xs hidden">كلمة المرور غير صحيحة!</p>
                
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-lg shadow-blue-600/20">
                    دخول
                </button>
                <a href="index.html" class="block text-xs text-slate-400 hover:text-slate-200 mt-3 transition">← العودة للرئيسية</a>
            </form>
        </div>
    </div>

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-sliders text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">لوحة التحكم</h1>
                    <p class="text-xs text-slate-400">إضافة وإدارة نسخ الويندوز</p>
                </div>
            </div>
            <a href="index.html" class="text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg border border-slate-700 transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-8">

        <!-- Form Box -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl">
            <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-blue-500"></i> إضافة نسخة جديدة
            </h2>

            <form id="addForm" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-2">اسم النسخة:</label>
                    <input type="text" id="winName" placeholder="مثال: Windows 11 Pro 23H2" required 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-2">المعمارية (النواة):</label>
                        <select id="winArch" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                            <option value="x64">x64</option>
                            <option value="x86">x86 (32-bit)</option>
                            <option value="ARM64">ARM64</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-2">حجم الملف:</label>
                        <input type="text" id="winSize" placeholder="مثال: 4.5 GB" required 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-2">رابط التحميل المباشر:</label>
                    <input type="url" id="winUrl" placeholder="https://..." required 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 text-left" dir="ltr">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-2">وصف النسخة:</label>
                    <textarea id="winDesc" rows="3" placeholder="ملاحظات، متطلبات تشغيل..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
                    <i class="fa-solid fa-floppy-disk"></i> حفظ وإضافة النسخة
                </button>
            </form>
        </div>

        <!-- List Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl">
            <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
                <i class="fa-solid fa-list text-blue-500"></i> النسخ المتاحة حالياً
            </h2>

            <div id="adminList" class="space-y-3">
                <div class="text-center py-8 text-slate-500">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-blue-500"></i>
                    <p class="text-xs">جاري التحميل...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
        جميع الحقوق محفوظة &copy; 2026 - لوحة تحكم إدارة الويندوز
    </footer>

    <!-- Firebase Script Logic -->
    <script type="module">
        import { db, ref, push, onValue, remove } from './firebase-config.js';

        // عين كلمة المرور الخاصة بك هنا
        const ADMIN_PASS = "admin123"; 

        const loginScreen = document.getElementById('loginScreen');
        const loginForm = document.getElementById('loginForm');
        const passInput = document.getElementById('passInput');
        const loginError = document.getElementById('loginError');

        // التحقق من حالة الجلسة المسبقة
        if (sessionStorage.getItem('adminAuth') === 'true') {
            loginScreen.classList.add('hidden');
        }

        // تسجيل الدخول
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (passInput.value === ADMIN_PASS) {
                sessionStorage.setItem('adminAuth', 'true');
                loginScreen.classList.add('hidden');
            } else {
                loginError.classList.remove('hidden');
            }
        });

        const form = document.getElementById('addForm');
        const adminList = document.getElementById('adminList');
        const submitBtn = document.getElementById('submitBtn');

        // إضافة نسخة جديدة
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

            push(ref(db, 'windows'), {
                name: document.getElementById('winName').value.trim(),
                arch: document.getElementById('winArch').value,
                size: document.getElementById('winSize').value.trim(),
                url: document.getElementById('winUrl').value.trim(),
                desc: document.getElementById('winDesc').value.trim(),
                createdAt: Date.now()
            }).then(() => {
                form.reset();
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> حفظ وإضافة النسخة';
            }).catch((err) => {
                alert('حدث خطأ أثناء الحفظ: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> حفظ وإضافة النسخة';
            });
        });

        // قراءة البيانات وعرضها
        onValue(ref(db, 'windows'), (snapshot) => {
            adminList.innerHTML = '';
            const data = snapshot.val();

            if (!data) {
                adminList.innerHTML = `
                    <div class="text-center py-8 text-slate-500 bg-slate-950/50 rounded-xl border border-slate-800">
                        <i class="fa-solid fa-folder-open text-3xl mb-2 text-slate-600"></i>
                        <p class="text-xs">لا توجد نسخ مضافة حالياً.</p>
                    </div>
                `;
                return;
            }

            Object.keys(data).forEach(id => {
                const win = data[id];
                const item = document.createElement('div');
                item.className = 'bg-slate-950 border border-slate-800 p-4 rounded-xl flex items-center justify-between gap-4 hover:border-slate-700 transition';

                const name = document.createTextNode(win.name || '').textContent;
                const arch = document.createTextNode(win.arch || '').textContent;
                const size = document.createTextNode(win.size || '').textContent;

                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center text-blue-400">
                            <i class="fa-brands fa-windows"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-white">${name}</h4>
                            <div class="flex gap-2 text-[11px] text-slate-400 mt-0.5">
                                <span class="bg-slate-900 border border-slate-800 px-2 py-0.5 rounded text-blue-400 font-semibold">${arch}</span>
                                <span><i class="fa-solid fa-hard-drive ml-1"></i>${size}</span>
                            </div>
                        </div>
                    </div>
                    <button class="btn-del bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1" data-id="${id}">
                        <i class="fa-solid fa-trash-can"></i> حذف
                    </button>
                `;
                adminList.appendChild(item);
            });

            // حذف العناصر
            document.querySelectorAll('.btn-del').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    if (confirm('هل أنت تأكد من إزالة هذه النسخة؟')) {
                        remove(ref(db, `windows/${id}`));
                    }
                });
            });
        });
    </script>
</body>
</html>
